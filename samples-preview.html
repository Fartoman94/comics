<!doctype html><html><body style="margin:0;background:#555;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;font:12px sans-serif;color:#fff">
<script type="module">
// Sólo desarrollo: vista rápida de las ilustraciones de una muestra. ?w=voltaje&p=1-4
import { shotSvg } from '/src/samples/engine/compose.ts'
const q = new URLSearchParams(location.search)
const id = q.get('w') || 'voltaje'
const [a, b] = (q.get('p') || '1-3').split('-').map(Number)
const { work } = await import(`/src/samples/works/${id}.ts`)
const shots = []
if (q.get('cover')) shots.push(['portada', work.cover.shot, 0.65])
for (let i = a; i <= (b || a); i++) work.pages[i - 1]?.panels.forEach((pn, j) => shots.push([`p${i} v${j + 1}`, pn.shot, 0.75]))
for (const [label, shot, ratio] of shots) {
  const W = 800, H = Math.round(800 * ratio)
  const s = shotSvg(work.style, work.characters, shot, W, H, label.length * 97 + 13)
  const fig = document.createElement('figure'); fig.style.margin = '0'
  const i = new Image(); i.style.cssText = `height:${q.get('h') || 260}px;background:#fff;display:block`; i.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s)
  fig.append(i, Object.assign(document.createElement('figcaption'), { textContent: label }))
  document.body.appendChild(fig)
}
window.__done = true
</script></body></html>
