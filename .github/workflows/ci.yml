name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tipos y build
        run: npm run build
      - name: Tests unitarios
        run: npm test
      - name: Navegador para E2E
        run: npx playwright install --with-deps chromium
      - name: Tests E2E (Playwright)
        run: npm run test:e2e
      - name: Tests sobre el build de producción (CSP, 404, actualización, sin conexión)
        run: npx playwright test -c playwright.prod.config.ts
      - name: Tamaño de los bundles
        run: ls -l dist/assets | awk '{print $5, $9}' | sort -n
      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
